name: Update GitHub Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: read

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect GitHub repositories
        run: python scripts/generate_stats.py
